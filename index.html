<style>
:root{
  --cream:#f4ede0;--cream-dark:#e8dfc8;--cream-deep:#ddd0b8;
  --ink:#2b2318;--ink-soft:#5a4a36;--sepia:#8b6b3d;
  --moss:#5c6b3a;--moss-dark:#3e4a27;--rust:#a0522d;
  --gold:#c8922a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Cormorant Garamond',serif;background:var(--cream);color:var(--ink);min-height:100vh;display:flex;justify-content:center}
.phone{width:100%;max-width:430px;min-height:100vh;position:relative}

/* ── NAV BAR (bottom) ── */
.nav-bar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;
  background:var(--cream);border-top:1px solid rgba(139,107,61,.3);
  display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom,6px);
}
.nav-item{
  flex:1;padding:10px 4px 8px;display:flex;flex-direction:column;
  align-items:center;gap:3px;cursor:pointer;border:none;background:transparent;
  font-family:'Old Standard TT',serif;font-style:italic;font-size:10px;
  color:var(--ink-soft);letter-spacing:.05em;transition:.15s;
}
.nav-item.active{color:var(--moss-dark)}
.nav-item svg{width:22px;height:22px;stroke-width:1.4}
.nav-item.active svg{stroke:var(--moss-dark)}
.nav-item svg{stroke:var(--ink-soft)}
.nav-dot{width:4px;height:4px;border-radius:50%;background:var(--moss-dark);display:none}
.nav-item.active .nav-dot{display:block}

/* ── SCREENS ── */
.screen{display:none;padding:22px 20px 100px;min-height:100vh}
.screen.active{display:block}

/* ── HOME ── */
.home-header{text-align:center;padding:40px 0 30px}
.home-logo{margin:0 auto 20px;width:90px;height:90px;border:1px solid rgba(139,107,61,.3);border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,252,240,.6)}
.home-logo svg{width:66px;height:66px}
.home h1{font-weight:500;font-size:40px;font-style:italic;color:var(--ink);margin-bottom:4px}
.home-sub{font-family:'Old Standard TT',serif;font-style:italic;font-size:12px;letter-spacing:.35em;text-transform:uppercase;color:var(--sepia);margin-bottom:28px}
.home-cards{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.home-card{
  border:1.5px solid rgba(139,107,61,.3);border-radius:8px;
  padding:18px 20px;display:flex;align-items:center;gap:16px;
  cursor:pointer;background:rgba(255,252,240,.5);transition:.15s;
}
.home-card:active{background:var(--cream-dark)}
.home-card-icon{width:44px;height:44px;border-radius:50%;border:1px solid rgba(139,107,61,.4);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.home-card-icon svg{width:22px;height:22px;stroke:var(--moss-dark);stroke-width:1.4}
.home-card-body h3{font-weight:500;font-size:19px;font-style:italic;color:var(--ink);margin-bottom:2px}
.home-card-body p{font-size:13px;color:var(--ink-soft);font-style:italic}
.home-card-arrow{margin-left:auto;color:var(--sepia);font-size:18px}
.home-collection{border:1px solid rgba(139,107,61,.25);border-radius:8px;padding:14px 16px;background:rgba(255,252,240,.4)}
.home-collection h4{font-family:'Old Standard TT',serif;font-style:italic;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--sepia);margin-bottom:8px}
.collection-preview{display:flex;gap:8px;flex-wrap:wrap}
.coll-chip{font-size:13px;font-style:italic;padding:4px 10px;border:1px solid rgba(139,107,61,.3);border-radius:20px;color:var(--ink-soft)}
.coll-empty{font-size:14px;font-style:italic;color:var(--sepia)}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid rgba(139,107,61,.25);margin-bottom:20px}
.back-btn{width:38px;height:38px;border:1px solid var(--sepia);border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.back-btn:disabled{opacity:.3;cursor:default}
.topbar-title{font-family:'Old Standard TT',serif;font-style:italic;font-size:14px;color:var(--ink-soft)}
.badge{font-size:11px;padding:3px 10px;border-radius:20px;font-family:'Old Standard TT',serif;letter-spacing:.04em}
.badge-green{background:var(--moss-dark);color:var(--cream)}
.badge-rust{background:var(--rust);color:var(--cream)}
.badge-gold{background:var(--gold);color:var(--cream)}

/* ── DÉTERMINATION (réutilisé) ── */
.eyebrow{font-family:'Old Standard TT',serif;font-style:italic;font-size:12px;letter-spacing:.35em;text-transform:uppercase;color:var(--sepia);margin-bottom:8px}
.question-title{font-weight:500;font-size:27px;line-height:1.15;letter-spacing:-.01em}
.question-title em{font-style:italic;color:var(--moss-dark)}
.help-link{margin-top:10px;font-size:14px;font-style:italic;color:var(--ink-soft);display:inline-flex;align-items:center;gap:5px;border-bottom:1px dashed var(--sepia);padding-bottom:1px;cursor:pointer}
.hint{text-align:center;font-size:13px;color:var(--sepia);font-style:italic;margin:10px 0 18px}
.hint::before,.hint::after{content:"·";margin:0 8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.opt{background:rgba(255,252,240,.7);border:1.5px solid rgba(139,107,61,.3);border-radius:6px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative;transition:.15s;min-height:160px}
.opt:active{transform:scale(.97)}
.opt.sel{border-color:var(--moss-dark);border-width:2px;background:rgba(62,74,39,.07);box-shadow:0 0 0 3px rgba(62,74,39,.1)}
.opt .ck{position:absolute;top:7px;right:7px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--sepia);background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:.15s}
.opt.sel .ck{background:var(--moss-dark);color:var(--cream);border-color:var(--moss-dark)}
.opt svg{width:100%;max-width:110px;height:85px;margin-bottom:8px}
.opt-label{font-family:'Old Standard TT',serif;font-size:15px;font-style:italic;text-align:center;line-height:1.2}
.opt-sub{font-size:11px;color:var(--sepia);margin-top:2px;text-align:center}
.skip-btn{width:100%;border:1px dashed var(--sepia);border-radius:6px;padding:13px;font-family:'Cormorant Garamond',serif;font-size:16px;font-style:italic;color:var(--ink-soft);background:transparent;cursor:pointer;margin-bottom:18px}
.fixed-actions{position:fixed;bottom:68px;left:50%;transform:translateX(-50%);width:100%;max-width:430px;padding:10px 20px 14px;background:linear-gradient(to top,var(--cream) 60%,transparent);display:flex;gap:10px;z-index:10}
.btn{flex:1;padding:15px;font-family:'Old Standard TT',serif;font-size:15px;border-radius:6px;cursor:pointer;border:1.5px solid var(--ink);letter-spacing:.05em;transition:.15s}
.btn-p{background:var(--ink);color:var(--cream);flex:2}
.btn-p:disabled{background:rgba(43,35,24,.2);border-color:rgba(43,35,24,.2);cursor:default}
.btn-s{background:transparent;color:var(--ink)}

/* ── RÉSULTAT DÉTERM ── */
.result-ring{width:160px;height:160px;border-radius:50%;border:1.5px solid rgba(139,107,61,.3);background:rgba(255,252,240,.5);display:flex;align-items:center;justify-content:center;margin:14px auto 18px}
.result-ring svg{width:130px;height:130px}
.result-name{font-weight:500;font-size:36px;font-style:italic;color:var(--moss-dark);text-align:center;line-height:1.1;margin-bottom:4px}
.result-latin{font-family:'Old Standard TT',serif;font-style:italic;font-size:14px;color:var(--sepia);letter-spacing:.12em;text-align:center;margin-bottom:16px}
.result-body{border-top:1px solid rgba(139,107,61,.2);padding-top:16px}
.result-body h4{font-family:'Old Standard TT',serif;font-style:italic;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--sepia);margin:14px 0 5px}
.result-body p{font-size:16px;line-height:1.55}
.fun-fact{font-style:italic;color:var(--moss-dark);font-size:15px;margin-top:6px}
.path-recap{background:rgba(255,252,240,.5);border:1px solid rgba(139,107,61,.18);padding:12px;border-radius:6px;margin-top:6px}
.path-step{font-size:13px;color:var(--ink-soft);font-style:italic;margin-bottom:4px}
.path-step::before{content:"· ";color:var(--sepia)}
.save-btn{width:100%;padding:14px;border:1.5px solid var(--moss-dark);border-radius:6px;background:transparent;font-family:'Old Standard TT',serif;font-size:15px;color:var(--moss-dark);cursor:pointer;margin-bottom:8px;letter-spacing:.05em;transition:.15s}
.save-btn:active{background:rgba(62,74,39,.07)}
.save-btn.saved{background:var(--moss-dark);color:var(--cream)}

/* ── MULTI-CANDIDATS ── */
.multi-header{text-align:center;margin-bottom:18px}
.multi-header p{font-size:16px;font-style:italic;color:var(--ink-soft);margin-top:6px}
.cand-card{border:1.5px solid rgba(139,107,61,.3);border-radius:6px;padding:14px 16px;margin-bottom:10px}
.cand-card h3{font-weight:500;font-size:20px;font-style:italic;color:var(--moss-dark)}
.cand-card .cand-latin{font-family:'Old Standard TT',serif;font-style:italic;font-size:12px;color:var(--sepia);letter-spacing:.1em;margin-bottom:6px}
.cand-card .cand-clue{font-size:14px;color:var(--ink-soft);font-style:italic;line-height:1.45}
.cand-card .cand-clue strong{color:var(--rust);font-style:normal}
.cand-pick-btn{margin-top:10px;width:100%;padding:10px 12px;border:1.5px solid var(--moss-dark);background:transparent;color:var(--moss-dark);border-radius:6px;font-family:'Old Standard TT',serif;font-size:14px;font-style:italic;cursor:pointer;letter-spacing:.03em;transition:.15s}
.cand-pick-btn:active{transform:scale(.98)}
.cand-pick-btn.picked{background:var(--moss-dark);color:var(--cream)}

/* ── TERMES SURLIGNÉS ── */
.term{
  background:rgba(139,107,61,.12);color:var(--rust);
  border-bottom:1.5px solid var(--sepia);
  border-radius:2px;padding:0 3px;cursor:pointer;
  font-style:italic;white-space:nowrap;
  transition:background .15s;
}
.term:active{background:rgba(139,107,61,.25)}

/* ── ÉCRAN EXPLICATION ── */
.expl-screen{
  position:fixed;inset:0;background:var(--cream);
  z-index:100;overflow-y:auto;padding:24px 20px 40px;
  transform:translateX(100%);transition:transform .25s ease;
  max-width:430px;left:50%;margin-left:-215px;
}
@media(max-width:430px){.expl-screen{left:0;margin-left:0}}
.expl-screen.open{transform:translateX(0)}
.expl-topbar{display:flex;align-items:center;gap:14px;margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid rgba(139,107,61,.25)}
.expl-back{width:38px;height:38px;border:1px solid var(--sepia);border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.expl-back svg{stroke:var(--ink)}
.expl-topbar h2{font-weight:500;font-size:22px;font-style:italic;color:var(--moss-dark);line-height:1.15}
.expl-illustration{margin:0 auto 20px;display:flex;justify-content:center;padding:16px;background:rgba(255,252,240,.6);border:1px solid rgba(139,107,61,.2);border-radius:8px}
.expl-illustration svg{width:220px;height:120px}
.expl-section{margin-bottom:20px}
.expl-section h3{font-family:'Old Standard TT',serif;font-style:italic;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--sepia);margin-bottom:8px}
.expl-section p{font-size:17px;line-height:1.6;color:var(--ink)}
.expl-tip{background:rgba(62,74,39,.06);border-left:3px solid var(--moss-dark);padding:12px 14px;border-radius:0 6px 6px 0;font-size:15px;font-style:italic;color:var(--moss-dark);margin-top:12px}
.expl-examples{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.expl-ex{display:flex;gap:12px;align-items:center;padding:10px;background:rgba(255,252,240,.5);border:1px solid rgba(139,107,61,.18);border-radius:6px}
.expl-ex svg{width:50px;height:42px;flex-shrink:0}
.expl-ex span{font-size:15px;font-style:italic;color:var(--ink-soft)}

/* ── MODAL ── *//* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(43,35,24,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.overlay.open{display:flex}
.modal{width:100%;max-width:430px;background:var(--cream);border-top:2px solid var(--ink);padding:24px 22px 36px;border-radius:8px 8px 0 0;animation:su .22s ease;max-height:78vh;overflow-y:auto;position:relative}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{font-weight:500;font-size:22px;font-style:italic;color:var(--moss-dark);margin-bottom:12px}
.modal p{font-size:16px;line-height:1.55;margin-bottom:10px}
.modal-close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:transparent;border:1px solid var(--sepia);cursor:pointer;font-size:18px;color:var(--ink)}
.modal-tip{font-size:14px;font-style:italic;color:var(--sepia);margin-top:10px;padding-top:10px;border-top:1px solid rgba(139,107,61,.2)}

/* ── APPRENTISSAGE ── */
.species-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.sp-card{border:1.5px solid rgba(139,107,61,.25);border-radius:6px;padding:14px 12px;cursor:pointer;background:rgba(255,252,240,.5);transition:.15s;text-align:center}
.sp-card:active{background:var(--cream-dark)}
.sp-card svg{width:64px;height:55px;margin-bottom:8px}
.sp-card h3{font-weight:500;font-size:16px;font-style:italic;color:var(--ink);line-height:1.2;margin-bottom:3px}
.sp-card .sp-latin{font-family:'Old Standard TT',serif;font-style:italic;font-size:10px;color:var(--sepia);letter-spacing:.08em}
.sp-card.collected{border-color:var(--moss-dark);background:rgba(62,74,39,.06)}
.sp-card .collected-mark{font-size:10px;color:var(--moss-dark);font-style:italic;margin-top:4px}
.filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:5px 14px;font-size:12px;border:1px solid rgba(139,107,61,.35);border-radius:20px;background:transparent;color:var(--ink-soft);cursor:pointer;font-family:'Old Standard TT',serif;font-style:italic;transition:.15s}
.filter-btn.active{border-color:var(--moss-dark);color:var(--moss-dark);background:rgba(62,74,39,.06)}

/* fiche espèce */
.fiche-header{text-align:center;margin-bottom:20px}
.fiche-header svg{width:140px;height:130px;margin-bottom:12px}
.fiche-name{font-weight:500;font-size:34px;font-style:italic;color:var(--moss-dark);margin-bottom:3px}
.fiche-latin{font-family:'Old Standard TT',serif;font-style:italic;font-size:14px;color:var(--sepia);letter-spacing:.12em;margin-bottom:10px}
.fiche-tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.tag{padding:3px 12px;border:1px solid rgba(139,107,61,.3);border-radius:20px;font-size:12px;color:var(--ink-soft);font-style:italic}
.fiche-section{margin-bottom:16px}
.fiche-section h4{font-family:'Old Standard TT',serif;font-style:italic;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--sepia);margin-bottom:6px}
.fiche-section p{font-size:16px;line-height:1.6}
.fiche-section .fun{font-style:italic;color:var(--moss-dark)}
.recognise-items{display:flex;flex-direction:column;gap:8px}
.rec-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:rgba(255,252,240,.5);border:1px solid rgba(139,107,61,.2);border-radius:6px}
.rec-item svg{width:32px;height:32px;flex-shrink:0;margin-top:2px}
.rec-item p{font-size:14px;line-height:1.45;color:var(--ink)}

/* ── COLLECTION (Pokédex) ── */
.coll-screen-header{text-align:center;margin-bottom:20px}
.coll-progress-bar{height:4px;background:rgba(139,107,61,.15);border-radius:2px;margin:10px 0 4px}
.coll-progress-fill{height:100%;background:var(--moss-dark);border-radius:2px;transition:width .5s}
.coll-progress-label{font-family:'Old Standard TT',serif;font-style:italic;font-size:12px;color:var(--sepia);text-align:center;margin-bottom:16px}
.coll-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.coll-card{border-radius:8px;padding:14px 10px 12px;text-align:center;cursor:pointer;transition:.15s;position:relative;border:1.5px solid rgba(139,107,61,.25);background:rgba(255,252,240,.5)}
.coll-card:active{transform:scale(.97)}
.coll-card.unlocked{border-color:var(--moss-dark);background:rgba(62,74,39,.06)}
.coll-card.locked{border-color:rgba(139,107,61,.15);background:rgba(244,237,224,.3)}
.coll-card svg{width:80px;height:70px;margin-bottom:8px}
.coll-card.locked svg{opacity:.22;filter:sepia(1) brightness(.9)}
.coll-card h3{font-weight:500;font-size:15px;font-style:italic;line-height:1.2;margin-bottom:2px}
.coll-card.locked h3{color:rgba(43,35,24,.3)}
.coll-card.unlocked h3{color:var(--moss-dark)}
.coll-card .coll-latin{font-family:'Old Standard TT',serif;font-style:italic;font-size:10px;letter-spacing:.06em}
.coll-card.locked .coll-latin{color:rgba(43,35,24,.2)}
.coll-card.unlocked .coll-latin{color:var(--sepia)}
.coll-card .coll-lock{position:absolute;top:8px;right:8px;font-size:13px;opacity:.3}
.coll-card.unlocked .coll-lock{display:none}
.coll-card .coll-check{position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--moss-dark);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--cream)}
.coll-card.locked .coll-check{display:none}

/* ── QUIZ ── *//* ── QUIZ ── */
.quiz-progress-bar{height:3px;background:rgba(139,107,61,.2);border-radius:2px;margin-bottom:20px}
.quiz-progress-fill{height:100%;background:var(--moss-dark);border-radius:2px;transition:width .3s}
.quiz-q-box{margin-bottom:16px}
.quiz-num{font-family:'Old Standard TT',serif;font-style:italic;font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--sepia);margin-bottom:8px}
.quiz-question{font-weight:500;font-size:22px;line-height:1.3;margin-bottom:16px}
.quiz-choices{display:flex;flex-direction:column;gap:9px}
.quiz-choice{padding:13px 16px;border:1.5px solid rgba(139,107,61,.3);border-radius:6px;background:rgba(255,252,240,.5);color:var(--ink);cursor:pointer;font-size:16px;font-family:'Cormorant Garamond',serif;text-align:left;transition:.15s;line-height:1.3}
.quiz-choice:active:not(:disabled){transform:scale(.98)}
.quiz-choice.correct{border-color:var(--moss-dark);background:rgba(62,74,39,.1);color:var(--moss-dark)}
.quiz-choice.wrong{border-color:var(--rust);background:rgba(160,82,45,.08);color:var(--rust)}
.quiz-feedback{margin-top:12px;padding:12px;background:rgba(255,252,240,.6);border:1px solid rgba(139,107,61,.2);border-radius:6px;font-size:15px;font-style:italic;line-height:1.5;color:var(--ink-soft)}
.quiz-next{margin-top:12px;width:100%;padding:15px;background:var(--ink);color:var(--cream);border:none;border-radius:6px;font-family:'Old Standard TT',serif;font-size:15px;letter-spacing:.05em;cursor:pointer;display:none}

/* score final */
.score-screen{text-align:center;padding:30px 0}
.score-ring{width:140px;height:140px;border-radius:50%;border:2px solid var(--moss-dark);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 20px;background:rgba(62,74,39,.06)}
.score-num{font-size:48px;font-weight:500;font-style:italic;color:var(--moss-dark);line-height:1}
.score-denom{font-size:18px;color:var(--sepia);font-style:italic}
.score-msg{font-size:22px;font-weight:500;font-style:italic;color:var(--ink);margin-bottom:8px}
.score-sub{font-size:16px;font-style:italic;color:var(--ink-soft);margin-bottom:24px}
.score-details{text-align:left;margin-bottom:20px}
.score-detail-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(139,107,61,.15);font-size:14px;font-style:italic}
.score-detail-item .mark{font-weight:500}
.mark-ok{color:var(--moss-dark)}
.mark-ko{color:var(--rust)}

/* ────────────────────────────────
   COLLECTION (localStorage)
──────────────────────────────── */
function loadCollection(){
  try{ return JSON.parse(localStorage.getItem('naturalia_coll')||'[]'); }
  catch(e){ return []; }
}
function saveCollection(arr){
  try{ localStorage.setItem('naturalia_coll', JSON.stringify(arr)); } catch(e){}
}
function addToCollection(name){
  const coll = loadCollection();
  const n = normName(name);
  if(!coll.includes(n)){ coll.push(n); saveCollection(coll); }
}
function removeFromCollection(name){
  const n = normName(name);
  const coll = loadCollection().filter(x=>x!==n);
  saveCollection(coll);
}
function toggleCollection(name, btnId){
  if(isCollected(name)){
    removeFromCollection(name);
    const btn=document.getElementById(btnId);
    if(btn){ btn.textContent='+ Ajouter à ma collection'; btn.classList.remove('saved'); }
  } else {
    addToCollection(name);
    const btn=document.getElementById(btnId);
    if(btn){ btn.textContent='✓ Dans ma collection — appuie pour retirer'; btn.classList.add('saved'); }
  }
  updateHomeCollection();
}
function isCollected(name){
  return loadCollection().includes(normName(name));
}
function updateHomeCollection(){
  const coll=loadCollection();
  const el=document.getElementById('home-coll-preview');
  if(!el) return;
  const total=72;
  if(coll.length===0){
    el.innerHTML='Aucun arbre identifié — commence par Déterminer !';
  } else {
    el.innerHTML=`${coll.length}\u00a0/\u00a0${total} arbre${coll.length>1?'s':''} identifié${coll.length>1?'s':''}`;
  }
}
function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

/* ────────────────────────────────
   NAVIGATION ÉCRANS
──────────────────────────────── */
let currentScreen = 'home';
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  const navBtn = document.getElementById('nav-'+name);
  if(navBtn) navBtn.classList.add('active');
  currentScreen = name;
  if(name==='home') updateHomeCollection();
  if(name==='determ' && !determStarted){ renderDetermHome(); determStarted=true; }
  if(name==='learn') renderLearnList();
  if(name==='quiz' && !quizActive) renderQuizHome();
  if(name==='coll') renderCollScreen();
}

   UTILITAIRES
──────────────────────────────── */
function normName(s){ return s?s.trim().replace(/\.+$/,'').toLowerCase():''; }
function findSpeciesDB(name){
  const n=normName(name);
  for(const [k,v] of Object.entries(SPECIES_DB)){
    if(normName(k)===n) return {key:k,...v};
  }
  return null;
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

──────────────────────────────── */
const dState = { frontier:[KEY_TREE], history:[], stepCount:0 };
let determStarted = false;

function dCountSp(nodes){ const s=new Set(); nodes.forEach(n=>dCollSp(n,s)); return s.size; }
function dCollSp(node,out){
  if(!node) return;
  const sp=node.species;
  if(sp){ (Array.isArray(sp)?sp:[sp]).forEach(x=>out.add(normName(x))); }
  Object.values(node.children||{}).forEach(c=>dCollSp(c,out));
}
function dGetAllSp(nodes){ const s=new Set(); nodes.forEach(n=>dCollSp(n,s)); return [...s]; }

function getBestQuestion(){
  const cMap={};
  for(const node of dState.frontier){
    for(const [k,child] of Object.entries(node.children||{})){
      const mapped=C2C[k]; if(!mapped) continue;
      const [concept,val]=mapped.split(':');
      if(!cMap[concept]) cMap[concept]={vals:new Set(),nodes_by_val:{},concept};
      cMap[concept].vals.add(val);
      if(!cMap[concept].nodes_by_val[val]) cMap[concept].nodes_by_val[val]=[];
      cMap[concept].nodes_by_val[val].push(child);
    }
  }
  let best=null,bestScore=0;
  for(const [concept,data] of Object.entries(cMap)){
    if(!CONCEPTS[concept]) continue;
    if(data.vals.size>bestScore){ bestScore=data.vals.size; best={concept,...data}; }
  }
  return best;
}

function dAdvance(selectedVals,question){
  const newF=[];
  for(const val of selectedVals){
    (question.nodes_by_val[val]||[]).forEach(n=>newF.push(n));
  }
  for(const node of dState.frontier){
    for(const [k,child] of Object.entries(node.children||{})){
      if(!C2C[k]) newF.push(child);
    }
  }
  if(!newF.length) return false;
  dState.history.push({frontier:[...dState.frontier],question,selected:selectedVals});
  dState.frontier=newF; dState.stepCount++; return true;
}
function dSkipAll(question){
  const newF=[];
  dState.frontier.forEach(node=>Object.values(node.children||{}).forEach(c=>newF.push(c)));
  dState.history.push({frontier:[...dState.frontier],question,selected:['?']});
  dState.frontier=newF.length?newF:dState.frontier; dState.stepCount++;
}
function dGoBack(){
  if(!dState.history.length) return;
  const p=dState.history.pop(); dState.frontier=p.frontier; dState.stepCount--;
}
function dRestart(){
  dState.frontier=[KEY_TREE]; dState.history=[]; dState.stepCount=0;
  renderDetermHome();
}

function renderDetermQuestion(){
  const totalSp=dCountSp(dState.frontier);
  const allSp=dGetAllSp(dState.frontier);
  const direct=[];
  for(const node of dState.frontier){
    if(!Object.keys(node.children||{}).length && node.species){
      const sp=node.species; (Array.isArray(sp)?sp:[sp]).forEach(x=>direct.push(normName(x)));
    }
  }
  const uniqDirect=[...new Set(direct)];
  if(uniqDirect.length===1){ renderDetermResult(uniqDirect[0]); return; }
  if(totalSp<=5){
    const q=getBestQuestion();
    if(!q){ renderDetermMulti([...new Set(allSp)]); return; }
  }
  const q=getBestQuestion();
  if(!q){
    const sp=[...new Set(allSp)];
    if(sp.length===1) renderDetermResult(sp[0]); else renderDetermMulti(sp);
    return;
  }
  const concept=CONCEPTS[q.concept];
  const availVals=new Set(q.vals);
  const opts=concept.opts.filter(o=>availVals.has(o.v));
  const few=totalSp<=5;
  document.getElementById('determ-content').innerHTML=`
    <div class="topbar">
      <button class="back-btn" ${!dState.history.length?'disabled':''} onclick="dGoBack();renderDetermQuestion()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="topbar-title">Étape ${dState.stepCount+1}</div>
      <div class="badge ${few?'badge-rust':'badge-green'}">${totalSp} espèce${totalSp>1?'s':''}</div>
    </div>
    <div style="text-align:center;margin-bottom:16px">
      <div class="eyebrow">— Observation —</div>
      <h1 class="question-title">${concept.titre}</h1>
      <div class="help-link" onclick="openConceptModal('${esc(q.concept)}')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        qu'est-ce que ça veut dire ?
      </div>
    </div>
    <div class="hint">tu peux cocher plusieurs réponses</div>
    <div class="opts" id="opts-grid">
      ${opts.map(o=>`
        <div class="opt" data-v="${esc(o.v)}" onclick="toggleOpt(this)">
          <div class="ck">✓</div>
          <svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">${o.svg}</svg>
          <div class="opt-label">${o.label}</div>
          ${o.sub?`<div class="opt-sub">${o.sub}</div>`:''}
        </div>`).join('')}
    </div>
    <button class="skip-btn" onclick="dSkipAll(getBestQuestion());renderDetermQuestion()">Je ne sais pas — passer</button>
    <div class="fixed-actions">
      <button class="btn btn-s" onclick="dRestart()">Recommencer</button>

    </div>`;
}

function renderDetermMulti(candidates){
  const coll=loadCollection();
  const cards=candidates.slice(0,6).map(spName=>{
    const info=findSpeciesDB(spName)||{};
    const displayName=info.key||capitalize(spName);
    const otherKey=Object.keys(info.clues||{})[0];
    const clueLines=otherKey?(info.clues[otherKey]||[]):[];
    const collected=coll.includes(normName(spName));
    return `<div class="cand-card">
      <h3>${displayName}</h3>
      <div class="cand-latin">${info.latin||''}</div>
      ${clueLines.length>0
        ?clueLines.map(l=>`<div class="cand-clue">${l.replace(/^([^:]+):/,'<strong>$1</strong> :')}</div>`).join('')
        :`<div class="cand-clue">${info.desc?(info.desc.substring(0,100)+'…'):''}</div>`}
      <button class="cand-pick-btn ${collected?'picked':''}" id="cand-btn-${esc(normName(spName)).replace(/[^a-z]/g,'')}" onclick="pickCandidate('${esc(spName)}')">
        ${collected?"✓ Dans ma collection":"C'est celui-là ! — ajouter"}
      </button>
    </div>`;
  }).join('');
  document.getElementById('determ-content').innerHTML=`
    <div class="topbar">
      <button class="back-btn" onclick="dGoBack();renderDetermQuestion()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="topbar-title">Résultat</div>
      <div class="badge badge-rust">${candidates.length} espèces</div>
    </div>
    <div class="multi-header">
      <div class="eyebrow">— Presque ! —</div>
      <h1 class="question-title">Ton arbre est l'un de ces <em>${candidates.length}</em></h1>
      <p>Lis les différences pour trancher</p>
    </div>
    <div>${cards}</div>
    <div class="fixed-actions">
      <button class="btn btn-s" onclick="dGoBack();renderDetermQuestion()">Affiner</button>
      <button class="btn btn-p" onclick="dRestart()">Recommencer</button>
    </div>`;
}

function pickCandidate(spName){
  const id = 'cand-btn-' + normName(spName).replace(/[^a-z]/g,'');
  const btn = document.getElementById(id);
  if(isCollected(spName)){
    removeFromCollection(spName);
    if(btn){ btn.textContent="C'est celui-là ! — ajouter"; btn.classList.remove('picked'); }
  } else {
    addToCollection(spName);
    if(btn){ btn.textContent="✓ Dans ma collection"; btn.classList.add('picked'); }
  }
  updateHomeCollection();
}

function startQuiz(n){
  quizActive=true;
  // Mélanger + prendre n questions
  const shuffled=[...QUIZ_BANK].sort(()=>Math.random()-.5).slice(0,n);
  quizState={questions:shuffled,idx:0,score:0,answers:[]};
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const {questions,idx}=quizState;
  if(idx>=questions.length){ renderQuizScore(); return; }
  const q=questions[idx];
  const progress=((idx/questions.length)*100).toFixed(0);
  let choicesHTML='';
  if(q.type==='qcm'){
    choicesHTML=q.opts.map((o,i)=>`
      <button class="quiz-choice" onclick="answerQuiz(${i})">${o}</button>`).join('');
  } else {
    choicesHTML=`
      <button class="quiz-choice" onclick="answerQuiz(true)">Vrai</button>
      <button class="quiz-choice" onclick="answerQuiz(false)">Faux</button>`;
  }
  document.getElementById('quiz-content').innerHTML=`
    <div class="topbar">
      <button class="back-btn" onclick="renderQuizHome()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="topbar-title">Question ${idx+1}/${questions.length}</div>
      <div class="badge badge-green">${quizState.score} pts</div>
    </div>
    <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${progress}%"></div></div>
    <div class="quiz-q-box">
      <div class="quiz-num">${q.type==='vf'?'Vrai ou Faux ?':'Question à choix multiple'}</div>
      <div class="quiz-question">${q.q}</div>
      <div class="quiz-choices" id="quiz-choices">${choicesHTML}</div>
      <div class="quiz-feedback" id="quiz-feedback" style="display:none"></div>
      <button class="quiz-next" id="quiz-next" onclick="nextQuizQuestion()">Question suivante →</button>
    </div>`;
}

function answerQuiz(val){
  const q=quizState.questions[quizState.idx];
  const correct = q.type==='qcm' ? (val===q.ans) : (val===q.ans);
  if(correct) quizState.score++;
  quizState.answers.push({q,val,correct});

  // Colorer les boutons
  const btns=document.querySelectorAll('.quiz-choice');
  btns.forEach(b=>b.disabled=true);
  if(q.type==='qcm'){
    btns.forEach((b,i)=>{
      if(i===q.ans) b.classList.add('correct');
      else if(i===val&&!correct) b.classList.add('wrong');
    });
  } else {
    btns.forEach(b=>{
      const bval = b.textContent.trim()==='Vrai';
      if(bval===q.ans) b.classList.add('correct');
      else if(bval===val&&!correct) b.classList.add('wrong');
    });
  }
  const fb=document.getElementById('quiz-feedback');
  fb.style.display='block';
  fb.innerHTML=`<strong>${correct?'✓ Bravo !':'✗ Pas tout à fait…'}</strong> ${q.exp}`;
  document.getElementById('quiz-next').style.display='block';
}

function nextQuizQuestion(){
  quizState.idx++;
  renderQuizQuestion();
}

function renderQuizScore(){
  const {score,questions,answers}=quizState;
  const total=questions.length;
  const pct=Math.round((score/total)*100);
  let msg,sub;
  if(pct>=90){ msg='Excellent !'; sub='Tu es un vrai naturaliste !'; }
  else if(pct>=70){ msg='Très bien !'; sub='Tu connais bien les arbres.'; }
  else if(pct>=50){ msg='Pas mal !'; sub='Encore un peu de pratique…'; }
  else { msg='Continue !'; sub='Va observer les arbres et reviens !'; }

  const details=answers.map(({q,correct})=>`
    <div class="score-detail-item">
      <span style="flex:1">${q.q.substring(0,50)}…</span>
      <span class="mark ${correct?'mark-ok':'mark-ko'}">${correct?'✓':'✗'}</span>
    </div>`).join('');

  document.getElementById('quiz-content').innerHTML=`
    <div class="topbar">
      <button class="back-btn" onclick="renderQuizHome()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="topbar-title">Résultat du quiz</div>
      <div></div>
    </div>
    <div class="score-screen">
      <div class="score-ring">
        <div class="score-num">${score}</div>
        <div class="score-denom">/ ${total}</div>
      </div>
      <div class="score-msg">${msg}</div>
      <div class="score-sub">${sub}</div>
      <div class="score-details">${details}</div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-s" onclick="startQuiz(quizState.questions.length)" style="flex:1">Recommencer</button>
        <button class="btn btn-p" onclick="showScreen('learn')" style="flex:2">Aller apprendre →</button>
      </div>
    </div>`;
  quizActive=false;
}

/* ────────────────────────────────
   MODAL CONCEPT
──────────────────────────────── */
function openConceptModal(concept){
  const c=CONCEPTS[concept]; if(!c) return;
  document.getElementById('modal-title').textContent=c.titre;
  document.getElementById('modal-body').textContent=c.explication;
  const svgEl=document.getElementById('modal-svg');
  svgEl.innerHTML=c.svg_modal||'';
  const tips={
    bord:'💡 Passe doucement le doigt sur le bord pour sentir.',
    pil:'💡 Retourne la feuille et touche le dessous.',
    nerv:'💡 Tiens la feuille à contre-jour pour mieux voir.',
  };
  document.getElementById('modal-tip').innerHTML=tips[concept]?`<div class="modal-tip">${tips[concept]}</div>`:'';
  document.getElementById('modal').classList.add('open');
}
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
function closeModalBg(e){ if(e.target.id==='modal') closeModal(); }

/* ────────────────────────────────
   INTERACTION DÉTERM
──────────────────────────────── */
function toggleOpt(el){
  el.classList.toggle('sel');
  const btn=document.getElementById('btn-next');
  if(btn) btn.disabled=document.querySelectorAll('.opt.sel').length===0;
}

/* ────────────────────────────────
   INIT
──────────────────────────────── */
updateHomeCollection();
</script>
